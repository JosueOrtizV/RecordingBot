services:
  postgres:
    image: postgres:16-alpine
    container_name: recordingbot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-recordingbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-recordingbot_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-recordingbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recordingbot} -d ${POSTGRES_DB:-recordingbot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - recordingbot_net

  redis:
    image: redis:7-alpine
    container_name: recordingbot-redis-1
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - recordingbot_net

  chrome-cdp:
    platform: linux/amd64
    container_name: recordingbot-chrome-cdp-1
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile.chrome-cdp
    shm_size: "2gb"
    environment:
      - TZ=${TIMEZONE:-America/Mexico_City}
    expose:
      - "9223"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/json/version"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - recordingbot_net

  meeting-bot:
    platform: linux/amd64
    container_name: recordingbot-meeting-bot-1
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile.production
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-America/Mexico_City}
      - NODE_ENV=production
      - REDIS_HOST=redis
      - GOOGLE_CHROME_CDP_URL=http://chrome-cdp:9223
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - GOOGLE_TOKEN_PATH=/app/token.json
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-4}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./recordings:/usr/src/app/dist/_tempvideo
      - ./whisper-env:/app/whisper-env:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
      chrome-cdp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - recordingbot_net

  scheduler:
    container_name: recordingbot-scheduler-1
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-America/Mexico_City}
      - NODE_ENV=production
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-recordingbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-recordingbot_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-recordingbot}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - GOOGLE_TOKEN_PATH=/app/token.json
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meeting-bot:
        condition: service_started
    restart: unless-stopped
    networks:
      - recordingbot_net

  dashboard-api:
    container_name: recordingbot-dashboard-api
    build:
      context: ./dashboard-api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-America/Mexico_City}
      - NODE_ENV=production
      - PORT=3002
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-recordingbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-recordingbot_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-recordingbot}
      - REDIS_HOST=redis
      - FRONTEND_URL=${FRONTEND_URL:-https://recordingbot.josueortiz.dev}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://recordingbot.josueortiz.dev/auth/google/callback}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-4}
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - recordingbot_net
      - web

  dashboard-frontend:
    container_name: recordingbot-dashboard-frontend
    build:
      context: ./dashboard-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - dashboard-api
    networks:
      - recordingbot_net
      - web

networks:
  recordingbot_net:
    driver: bridge
  web:
    external: true

volumes:
  redis_data:
  postgres_data:
